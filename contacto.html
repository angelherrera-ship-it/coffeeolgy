<body>

   <header>

<button type="button" id="btn-tema" class="boton-modo">Cambio de modo</button>
</header>
<main>
    <section id="contacto">
        <h2>Contáctanos</h2>
        <p>Escribinos tu consulta o visitá nuestra cafetería, nos encantará atenderte.</p>

        <form action="procesar.php" method="POST" id="form-contacto" novalidate>

            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre"><br><br>

            <label for="correo">Correo electrónico:</label><br>
            <input type="email" id="correo" name="correo" required><br><br>

            <label for="telefono">Teléfono:</label><br>
            <input type="tel" id="telefono" name="telefono"><br><br>

            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="5" cols="40"></textarea><br><br>

            <input type="submit" value="Enviar" id="btn-enviar" disabled>

        </form>
        <p id="form-estado" class="oculto"></p>
    </section>
</main>
<footer>

</footer>
<div id="modal-exito" class="modal oculto">
    <div class="modal-contenido">
        <h3>¡Gracias! ✅</h3>
        <p>Tu mensaje fue enviado correctamente. Te contactaremos pronto.</p>
        <button type="button" id="cerrar-modal">Cerrar</button>
    </div>
</div>
<script src="js/script.js"></script>
